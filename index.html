<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบวัฒนธรรมไทย</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .quiz-container {
            display: none;
        }

        .quiz-container.active {
            display: block;
        }

        .start-container {
            text-align: center;
        }

        .start-container.hidden {
            display: none;
        }

        .start-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .start-button:hover {
            background: #764ba2;
        }

        .progress {
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .question {
            margin-bottom: 30px;
        }

        .question-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-button {
            padding: 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 16px;
            color: #333;
        }

        .option-button:hover:not(:disabled) {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option-button:disabled {
            cursor: not-allowed;
        }

        .option-button.selected {
            border-color: #667eea;
            background: #e8ecff;
        }

        .option-button.correct {
            border-color: #10b981;
            background: #d1fae5;
            color: #10b981;
        }

        .option-button.incorrect {
            border-color: #ef4444;
            background: #fee2e2;
            color: #ef4444;
        }

        .feedback {
            display: none;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 16px;
        }

        .feedback.active {
            display: block;
        }

        .feedback.correct {
            background: #d1fae5;
            color: #10b981;
            border: 2px solid #10b981;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #ef4444;
            border: 2px solid #ef4444;
        }

        .answer-section {
            margin-top: 15px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            display: none;
        }

        .answer-section.active {
            display: block;
        }

        .answer-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .answer-text {
            color: #666;
            font-size: 14px;
        }

        .next-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .next-button:hover {
            background: #764ba2;
        }

        .next-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results-container {
            display: none;
            text-align: center;
        }

        .results-container.active {
            display: block;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }

        .score-message {
            font-size: 20px;
            color: #333;
            margin-bottom: 30px;
        }

        .restart-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .restart-button:hover {
            background: #764ba2;
        }

        .score-detail {
            margin-top: 20px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 10px;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .option-button {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 แบบทดสอบวัฒนธรรมไทย</h1>
            <p>สำรวจความรู้ด้านวัฒนธรรมไทยของคุณ</p>
        </div>

        <div class="start-container" id="startContainer">
            <p style="color: #666; font-size: 16px; margin-bottom: 20px;">
                ยินดีต้อนรับสู่แบบทดสอบวัฒนธรรมไทย<br>
                มี 5 ข้อคำถาม พร้อมเฉลยหลังการตอบแต่ละข้อ<br>
                เตรียมตัวให้พร้อมและเริ่มกันเลย!
            </p>
            <button class="start-button" onclick="startQuiz()">เริ่มแบบทดสอบ</button>
        </div>

        <div class="quiz-container" id="quizContainer">
            <div class="progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">ข้อ <span id="currentQuestion">1</span> จาก 5</div>
            </div>

            <div class="question">
                <div class="question-title" id="questionTitle"></div>
                <div class="options" id="optionsContainer"></div>
            </div>

            <div class="feedback" id="feedback"></div>
            <div class="answer-section" id="answerSection">
                <div class="answer-label">เฉลย:</div>
                <div class="answer-text" id="answerText"></div>
            </div>

            <button class="next-button" id="nextButton" onclick="nextQuestion()" disabled>ตอบไปข้อต่อไป</button>
        </div>

        <div class="results-container" id="resultsContainer">
            <h2 style="color: #333; margin-bottom: 20px;">🎉 ผลการทดสอบ</h2>
            <div class="score-display" id="scoreDisplay">0/5</div>
            <div class="score-message" id="scoreMessage"></div>
            <div class="score-detail" id="scoreDetail"></div>
            <button class="restart-button" onclick="restartQuiz()">ทำแบบทดสอบอีกครั้ง</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "พระเจ้ากรุงธนบุรี หรือ สมเด็จพระเจ้าตากสินมหาราช สถาปนากรุงธนบุรีเมื่อปีพ.ศ. ใด?",
                options: [
                    "2315",
                    "2325",
                    "2335",
                    "2345"
                ],
                correct: 1,
                answer: "สมเด็จพระเจ้าตากสินมหาราช สถาปนากรุงธนบุรีเมื่อปีพ.ศ. 2325 หลังจากที่อยุธยาตกต่อการบุกรุกของพม่า"
            },
            {
                question: "ศิลปะการทำ 'ลายผ้าไทย' แบบใด ถูกจัดให้เป็นมรดกวัฒนธรรมที่ไม่มีตัวตน ของยูเนสโก?",
                options: [
                    "ผ้าขาวม้า",
                    "ผ้าซิ่นไทย",
                    "ผ้าไทยทั่วไป",
                    "ทั้ง ก ข และ ค ถูกต้อง"
                ],
                correct: 0,
                answer: "ศิลปะการทำผ้าขาวม้า ซึ่งเป็นผ้าทีมีลายดำบนพื้นขาว ถูกยูเนสโกจัดให้เป็นมรดกวัฒนธรรมที่ไม่มีตัวตน"
            },
            {
                question: "ส่วนประกอบสำคัญของวัฒนธรรมไทยที่ถูกใช้ในศาสนสถาน และพิธีกรรมคืออะไร?",
                options: [
                    "ศิลปะการแต่งตัว",
                    "ศิลปะการบูชา",
                    "ศิลปะการปรุงอาหาร",
                    "ศิลปะการพูด"
                ],
                correct: 1,
                answer: "ศิลปะการบูชา หรือ การไหว้สวัสดิการต่าง ๆ ถูกใช้ในศาสนสถานและพิธีกรรมต่าง ๆ ของวัฒนธรรมไทย"
            },
            {
                question: "วัฒนธรรมการรับประทานอาหารของไทยนั้น มีลักษณะเป็นแบบใด?",
                options: [
                    "คนเดียวรับประทาน",
                    "การรับประทานร่วมกันเป็นครอบครัว",
                    "การรับประทานในโรงแรม",
                    "การรับประทานบนท้องถนน"
                ],
                correct: 1,
                answer: "วัฒนธรรมการรับประทานอาหารของไทยมีลักษณะเป็นการรับประทานร่วมกันเป็นครอบครัว ซึ่งเป็นส่วนสำคัญของวัฒนธรรม"
            },
            {
                question: "วัฒนธรรมไทยคุณค่าใดที่เกี่ยวข้องกับการเคารพผู้อาวุโส?",
                options: [
                    "ความสุภาพ",
                    "ความยุติธรรม",
                    "ความจริงใจ",
                    "ความสัตย์"
                ],
                correct: 0,
                answer: "ความสุภาพ คือค่านิยมทางวัฒนธรรมไทยที่เกี่ยวข้องกับการเคารพผู้อาวุโส การไหว้ และการใช้ถ้อยคำอ่อนไม่"
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = null;
        let answered = false;

        function startQuiz() {
            document.getElementById('startContainer').classList.add('hidden');
            document.getElementById('quizContainer').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            const quiz = quizData[currentQuestion];
            selectedAnswer = null;
            answered = false;

            // Update progress
            const progress = ((currentQuestion) / 5) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestion + 1;

            // Load question and options
            document.getElementById('questionTitle').textContent = quiz.question;
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            quiz.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-button';
                button.textContent = option;
                button.onclick = () => selectOption(index);
                optionsContainer.appendChild(button);
            });

            // Reset feedback and answer section
            document.getElementById('feedback').classList.remove('active', 'correct', 'incorrect');
            document.getElementById('answerSection').classList.remove('active');
            document.getElementById('nextButton').disabled = true;
        }

        function selectOption(index) {
            if (answered) return;

            selectedAnswer = index;
            const buttons = document.querySelectorAll('.option-button');
            
            buttons.forEach((btn, i) => {
                btn.classList.remove('selected');
                if (i === index) {
                    btn.classList.add('selected');
                }
            });

            // Show feedback after a short delay
            setTimeout(showFeedback, 300);
        }

        function showFeedback() {
            const quiz = quizData[currentQuestion];
            const isCorrect = selectedAnswer === quiz.correct;
            answered = true;

            // Update score
            if (isCorrect) {
                score++;
            }

            // Show visual feedback
            const buttons = document.querySelectorAll('.option-button');
            buttons.forEach((btn, i) => {
                if (i === quiz.correct) {
                    btn.classList.add('correct');
                } else if (i === selectedAnswer && !isCorrect) {
                    btn.classList.add('incorrect');
                }
                btn.disabled = true;
            });

            // Show feedback text
            const feedback = document.getElementById('feedback');
            feedback.classList.add('active');
            if (isCorrect) {
                feedback.classList.add('correct');
                feedback.classList.remove('incorrect');
                feedback.textContent = '✓ ถูกต้องค่ะ!';
            } else {
                feedback.classList.add('incorrect');
                feedback.classList.remove('correct');
                feedback.textContent = '✗ ไม่ถูกต้องค่ะ';
            }

            // Show answer
            document.getElementById('answerText').textContent = quiz.answer;
            document.getElementById('answerSection').classList.add('active');

            // Enable next button
            document.getElementById('nextButton').disabled = false;
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < 5) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quizContainer').classList.remove('active');
            document.getElementById('resultsContainer').classList.add('active');

            document.getElementById('scoreDisplay').textContent = score + '/5';

            // Show message based on score
            let message = '';
            if (score === 5) {
                message = 'ยอดเยี่ยม! คุณเป็นผู้เชี่ยวชาญด้านวัฒนธรรมไทย!';
            } else if (score >= 4) {
                message = 'ดีมาก! คุณมีความรู้ด้านวัฒนธรรมไทยมากมาย';
            } else if (score >= 3) {
                message = 'ปานกลาง คุณรู้จักวัฒนธรรมไทยบ้างแล้ว';
            } else if (score >= 1) {
                message = 'พยายามมากขึ้นนะ ลองศึกษาวัฒนธรรมไทยเพิ่มเติม';
            } else {
                message = 'ลองใหม่อีกครั้งนะ เพื่อหาความรู้ที่ลึกซึ้งยิ่งขึ้น';
            }
            document.getElementById('scoreMessage').textContent = message;

            // Show score detail
            const percentage = Math.round((score / 5) * 100);
            document.getElementById('scoreDetail').textContent = `คุณตอบถูก ${score} ข้อจากทั้งหมด 5 ข้อ (${percentage}%)`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            selectedAnswer = null;
            answered = false;

            document.getElementById('resultsContainer').classList.remove('active');
            document.getElementById('startContainer').classList.remove('hidden');
        }
    </script>
</body>
</html>
